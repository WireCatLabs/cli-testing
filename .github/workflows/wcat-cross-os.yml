name: wcat cross-OS install check

# Step 1 of cli-base's wcat umbrella plan, checked on real installs: two fixture CLIs on a cli-base build, installed
# globally with npm, pnpm and bun on Linux, macOS and Windows. Results: performance/cli/wcat-umbrella/cross-os.md
on:
  workflow_dispatch:
    inputs:
      cli_base_ref:
        description: cli-base commit, branch or tag to build
        required: false
  pull_request:
    paths:
      - .github/workflows/wcat-cross-os.yml
      - performance/cli/wcat-umbrella/cross-os.mjs

permissions:
  contents: read

env:
  # The head of cli-base PR #404 that was checked; a commit stays fetchable after the branch goes.
  CLI_BASE_REF: ${{ inputs.cli_base_ref || '2464983c835158b7f01f2b2fb4c7e848d68465cd' }}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/cli-base
          ref: ${{ env.CLI_BASE_REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build and pack cli-base
        run: |
          git rev-parse HEAD
          npx --yes pnpm@11.28.8 install --frozen-lockfile
          npx --yes pnpm@11.28.8 run build
          mkdir -p "$RUNNER_TEMP/cli-base"
          npm pack --pack-destination "$RUNNER_TEMP/cli-base"
          mv "$RUNNER_TEMP"/cli-base/*.tgz "$RUNNER_TEMP/cli-base/cli-base.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-base
          path: ${{ runner.temp }}/cli-base/cli-base.tgz
          retention-days: 7

  check:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-base
          path: ${{ runner.temp }}/cli-base
      - name: Install pinned package managers
        run: |
          npm install --global --prefix "${{ runner.temp }}/wcat-tools" npm@11.17.0 pnpm@12.11.2 bun@1.3.14
          node -e "const fs = require('node:fs'); const path = require('node:path'); fs.appendFileSync(process.env.GITHUB_PATH, path.join(process.env.RUNNER_TEMP, 'wcat-tools', ...(process.platform === 'win32' ? [] : ['bin'])) + '\n')"
      - name: Check
        run: node performance/cli/wcat-umbrella/cross-os.mjs "${{ runner.temp }}/cli-base/cli-base.tgz" "${{ runner.temp }}/wcat-out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wcat-cross-os-${{ matrix.os }}
          path: ${{ runner.temp }}/wcat-out
          retention-days: 30
