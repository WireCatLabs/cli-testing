name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: leemour/cli-core/.github/workflows/node-ci.yml@b8acbeebf38cd37edcdcc193152ba5d2c11928cb # v0.17.2
    with:
      checks: |
        pnpm docs:check

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A warning, never a failure: bin/release takes the next free version itself.
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          floor=$(printf '%s\n%s\n' "$main" "$latest" | sort -V | tail -1)
          versions=$(npm view "$name" versions --json 2>/dev/null || true)
          next=$(npx -y -p @leemour/cli-core@0.17.0 cli-dev next-version "$pr" "$floor" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above both main ($main) and npm's latest ($latest)" \
            "— bin/release will publish it as $next"
